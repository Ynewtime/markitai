<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Markitai</title>
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --text-1: #18181b; --text-2: #52525b; --hairline: #e4e4e7;
    --accent: #18181b; --accent-contrast: #ffffff;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
      "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b; --surface: #18181b; --text-1: #fafafa; --text-2: #a1a1aa; --hairline: #27272a;
      --accent: #fafafa; --accent-contrast: #18181b;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text-1);
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: text; user-select: text;
  }
  main { width: min(640px, calc(100% - 48px)); }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--text-2); margin: 0 0 8px; }
  pre {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 12px; margin: 16px 0 0; max-height: 40vh; overflow: auto;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
  }
  .actions { display: flex; gap: 8px; margin-top: 20px; }
  .actions a {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--hairline);
    color: var(--text-1); text-decoration: none; font-weight: 500;
  }
  .actions a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .spinner {
    width: 22px; height: 22px; margin-bottom: 16px; border-radius: 50%;
    border: 2px solid var(--hairline); border-top-color: var(--text-1);
    animation: spin 0.8s linear infinite;
  }
  body:not([data-phase="starting"]):not([data-phase="stopping"]) .spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body data-phase="{{.Phase}}" data-cause="{{.Cause}}">
<main>
  <div class="spinner"></div>
  <h1>{{.Title}}</h1>
  {{range .Body}}<p>{{.}}</p>
  {{end}}{{if .Tail}}<pre>{{.Tail}}</pre>{{end}}
  {{if .Buttons}}<div class="actions">
    {{range .Buttons}}<a href="{{.Href}}" target="_blank"{{if .Primary}} class="primary"{{end}}>{{.Label}}</a>
    {{end}}</div>{{end}}
</main>
</body>
</html>
