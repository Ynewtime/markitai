[package]
name = "markitai-native"
version = "2.3.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
description = "Markitai Native for GNOME: GTK 4, libadwaita and WebKitGTK 6 around the markitai core"

[[bin]]
name = "markitai-native"
path = "src/main.rs"

[dependencies]
markitai-app = { path = "../../../crates/markitai-app" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
webkit6 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

# Its own workspace (the root Cargo.toml excludes desktop/native/linux), so the root's
# patches and profiles are repeated here: Cargo reads both only from the
# workspace root.
[workspace]

[patch.crates-io]
anydoc = { path = "../../../vendor/anydoc" }
htmd = { path = "../../../vendor/htmd" }
iwork = { path = "../../../vendor/iwork" }
lopdf = { path = "../../../vendor/lopdf" }
pdf-inspector = { path = "../../../vendor/pdf-inspector" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.dev.package.tract-linalg]
opt-level = 3

[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = "z"

[profile.release.package.markitai-app]
opt-level = 3

[profile.release.package.markitai-core]
opt-level = 3

[profile.release.package.pdf-inspector]
opt-level = 3

[profile.release.package.lopdf]
opt-level = 3

[profile.release.package.anydoc]
opt-level = 3

[profile.release.package.quick-xml]
opt-level = 3

[profile.release.package.zip]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.html5ever]
opt-level = 3

[profile.release.package.markup5ever]
opt-level = 3

[profile.release.package.scraper]
opt-level = 3

[profile.release.package.selectors]
opt-level = 3

[profile.release.package.cssparser]
opt-level = 3

[profile.release.package.htmd]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[profile.release.package.regex-syntax]
opt-level = 3

[profile.release.package.aho-corasick]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.rav1d]
opt-level = 3

[profile.release.package.markitai-webp-sys]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.csv]
opt-level = 3

[profile.release.package.encoding_rs]
opt-level = 3

[profile.release.package.mail-parser]
opt-level = 3

[profile.release.package.vello_cpu]
opt-level = 3

[profile.release.package.vello_common]
opt-level = 3

[profile.release.package.fearless_simd]
opt-level = 3

[profile.release.package.tract-linalg]
opt-level = 3

