[package]
name = "markitai-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

# The native apps' private core: the Linux app depends on it as a Rust
# library; the macOS and Windows builds ask `cargo rustc --crate-type
# staticlib` or `cdylib` for the C ABI, so no other build links it twice.
[lib]
name = "markitai_app"

[dependencies]
markitai-core.workspace = true
serde_json.workspace = true
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
