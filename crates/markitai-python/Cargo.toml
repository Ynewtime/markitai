[package]
name = "markitai-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
markitai-core.workspace = true
# The wheel's `markitai`, `mkai` and `markitai-mcp` entry points run it.
markitai-cli = { path = "../markitai-cli" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[build-dependencies]
pyo3-build-config = "0.29"
