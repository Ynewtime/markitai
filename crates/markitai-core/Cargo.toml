[package]
name = "markitai-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests: the library has none, and rustdoc would still build one run.
[lib]
doctest = false

[dependencies]
tract-onnx = { version = "=0.23.8", default-features = false, optional = true }
# tract's own matrix kernels on several threads (rayon), for text detection.
tract-linalg = { version = "=0.23.8", default-features = false, features = ["multithread-mm"], optional = true }
rayon = { version = "1.12", optional = true }
# The default local OCR engine on x86_64 and aarch64 (pure Rust, runtime CPU dispatch); tract stays as the fallback.
qppocr = { version = "=0.3.1", default-features = false, features = ["std", "parallel"], optional = true }
base64 = "0.23"
libc = "0.2"
tiff = "0.11.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
# Lossy WebP output, as Python markitai 1.2 wrote it with Pillow: libwebp
# 1.6.0's encoder, vendored C built statically (vendor/libwebp/README.md).
markitai-webp-sys = { path = "../../vendor/libwebp" }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# Same version and features as usvg uses, so SVG fallback checks read cmaps as rendering does.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
lopdf = { version = "0.46", default-features = false }
png = "0.18"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
# rustls without reqwest's own crypto provider (aws-lc-rs, which needs extra
# build tools on Windows Arm64): `trust.rs` gives every client a ring config.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "multipart", "json", "form", "rustls-no-provider", "gzip", "brotli"] }
# The built-in Mozilla roots, and the system's certificate authorities (or
# SSL_CERT_FILE/SSL_CERT_DIR) trusted beside them (`trust.rs`).
webpki-roots = "1"
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
url = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sha2 = "0.11"
# Bedrock request signing (HMAC-SHA256) and Vertex AI service-account tokens
# (RS256); the same ring rustls already links.
ring = "0.17"
yaml_serde = "0.10.7"
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
globset = "0.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
anydoc = "0.2.4"
iwork = "=0.2.1"
pdf-inspector = { version = "1.25.2", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
cfb = "0.15"
encoding_rs = "0.8"
csv = "1"
cssparser = "0.38"
scraper = "0.29"
markup5ever = "0.40"
# The tokenizer and tree builder scraper uses, joined in `formats/html/parse.rs`.
html5ever = "0.40"
# General categories for titles (`titles.rs`) and readable addresses (`iri.rs`).
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
unicode-normalization = "0.1.26"
htmd = { version = "0.5", default-features = false }
quick-xml = "0.42"
mail-parser = { version = "0.11", features = ["full_encoding"] }
# Plain text, pages and tables of the document JSON (docs/json-output.md).
pulldown-cmark = { version = "0.13.4", default-features = false }
# Portable page renderer (docs/pdf-rendering.md). Always compiled where
# CoreGraphics is unavailable; on macOS through the default `portable-media`
# feature, which brings the portable OCR engine that macOS reads with by default. `embed-fonts` adds the standard-14
# substitutes (PDFium's Foxit faces, BSD-3-Clause, ~264 KB) and `embed-cmaps`
# the 61 predefined CJK CMaps (Adobe, BSD-3-Clause, ~251 KB compressed).
# `simd` keeps pic-scale's NEON/SSE/AVX image scaling, which hayro 0.8 puts
# behind that feature: without it a page with a scaled image costs up to 27%
# more instructions than with hayro 0.7.1.
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts", "embed-cmaps", "simd"], optional = true }
memchr = { version = "2", optional = true }

[features]
# Pure-Rust page rendering (and, with the OCR package, recognition) that
# Windows and Linux always use. macOS builds it too, by default: its local OCR
# reads with the portable engine (Vision is chosen with
# `MARKITAI_OCR_BACKEND=vision`, and is the fallback when the models cannot be
# downloaded); page rendering stays CoreGraphics there.
default = ["portable-media"]
portable-media = ["dep:hayro", "dep:memchr", "dep:tract-onnx", "dep:tract-linalg", "dep:rayon", "dep:qppocr"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts", "embed-cmaps", "simd"] }
memchr = "2"
tract-onnx = { version = "=0.23.8", default-features = false }
tract-linalg = { version = "=0.23.8", default-features = false, features = ["multithread-mm"] }
rayon = "1.12"
qppocr = { version = "=0.3.1", default-features = false, features = ["std", "parallel"] }
# Pure-Rust HEIF/HEIC (HEVC) decoding; macOS uses ImageIO.
heifer = { version = "=0.2.0", default-features = false }
# AV1 for AVIF: upstream rav1d with its safe Rust API, vendored without its
# assembly (vendor/rav1d/MARKITAI-PATCH.md); macOS uses ImageIO.
rav1d = { path = "../../vendor/rav1d", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSObject"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNRequestHandler", "VNRequest", "VNObservation", "VNTypes", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
md-5 = "0.11"
tempfile.workspace = true
