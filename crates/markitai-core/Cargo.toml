[package]
name = "markitai-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tract-onnx = { version = "=0.23.8", default-features = false, optional = true }
base64 = "0.22"
libc = "0.2"
tiff = "0.11.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# Same version and features as usvg uses, so SVG fallback checks read cmaps as rendering does.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
lopdf = { version = "0.45", default-features = false }
png = "0.18"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls", "gzip", "brotli"] }
url = "2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
sha2 = "0.11"
serde_yaml = "0.9"
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
globset = "0.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
anydoc = "0.2.4"
iwork = "=0.2.1"
pdf-inspector = { version = "1.25.1", default-features = false }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
cfb = "0.14"
encoding_rs = "0.8"
csv = "1"
cssparser = "0.37"
scraper = "0.27"
markup5ever = "0.39"
htmd = { version = "0.5", default-features = false }
quick-xml = "0.41"
mail-parser = { version = "0.11", features = ["full_encoding"] }
# Portable page renderer (docs/pdf-rendering.md). Always compiled where
# CoreGraphics is unavailable; on macOS only with `portable-media`, so the
# default macOS build is unchanged. `embed-fonts` adds the standard-14
# substitutes (PDFium's Foxit faces, BSD-3-Clause, ~264 KB) and `embed-cmaps`
# the 61 predefined CJK CMaps (Adobe, BSD-3-Clause, ~251 KB compressed).
hayro = { version = "=0.7.1", default-features = false, features = ["embed-fonts", "embed-cmaps"], optional = true }
memchr = { version = "2", optional = true }

[features]
# Pure-Rust page rendering (and, with the OCR package, recognition) that
# Windows and Linux always use; on macOS it is compiled beside the native
# frameworks for development and comparison.
portable-media = ["dep:hayro", "dep:memchr", "dep:tract-onnx"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
hayro = { version = "=0.7.1", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
memchr = "2"
tract-onnx = { version = "=0.23.8", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSObject"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNRequestHandler", "VNRequest", "VNObservation", "VNTypes", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
tracing = "0.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
md-5 = "0.11"
tempfile.workspace = true
