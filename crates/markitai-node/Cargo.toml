[package]
name = "markitai-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
markitai-core.workspace = true
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
