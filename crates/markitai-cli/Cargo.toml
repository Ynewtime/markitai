[package]
name = "markitai-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The program is a library so the Python wheel's native extension runs it too.
[lib]
name = "markitai_cli"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "markitai"
path = "src/main.rs"
test = false

# mkai includes main.rs; the unit tests are the library's.
[[bin]]
name = "mkai"
path = "src/mkai.rs"
test = false

[features]
portable-media = ["markitai-core/portable-media"]

[dependencies]
markitai-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
clap = { version = "4", features = ["derive", "wrap_help"] }
globset = "0.4"
walkdir = "2"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md-5 = "0.11"
uuid = { version = "1", features = ["v4"] }
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.11"
caseless = "0.2.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "signal", "time", "fs", "io-util", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The same backend as zip: no new code. Decompresses the gzip-embedded web assets.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
