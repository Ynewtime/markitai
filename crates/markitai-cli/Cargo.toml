[package]
name = "markitai-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "markitai"
path = "src/main.rs"

[[bin]]
name = "mkai"
path = "src/mkai.rs"

[dependencies]
markitai-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
clap = { version = "4", features = ["derive", "wrap_help"] }
globset = "0.4"
walkdir = "2"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md-5 = "0.11"
uuid = { version = "1", features = ["v4"] }
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.11"
caseless = "0.2.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "signal", "time", "fs", "io-util", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
