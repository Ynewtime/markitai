[workspace]
members = ["crates/*"]
exclude = ["vendor/pdf-inspector", "vendor/anydoc", "vendor/lopdf", "vendor/htmd", "vendor/rav1d"]
default-members = ["crates/markitai-core", "crates/markitai-cli", "crates/markitai-ffi"]
resolver = "2"

[workspace.package]
version = "1.3.0-dev"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
markitai-core = { path = "crates/markitai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

# Workspace crates and the conversion hot path are optimized for speed; every
# other dependency (server, network/TLS, CLI parsing, fonts/SVG, ...) for size.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = "z"

[profile.release.package.pdf-inspector]
opt-level = 3

[profile.release.package.lopdf]
opt-level = 3

[profile.release.package.anydoc]
opt-level = 3

[profile.release.package.quick-xml]
opt-level = 3

[profile.release.package.zip]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.html5ever]
opt-level = 3

[profile.release.package.markup5ever]
opt-level = 3

[profile.release.package.scraper]
opt-level = 3

[profile.release.package.selectors]
opt-level = 3

[profile.release.package.cssparser]
opt-level = 3

[profile.release.package.htmd]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[profile.release.package.regex-syntax]
opt-level = 3

[profile.release.package.aho-corasick]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

# The portable AVIF decoder (Windows and Linux). Measured on Linux arm64 against
# "z": +230,392 B, and a 1600x1000 AVIF decodes in 32 ms instead of 49 ms, a
# 12-megapixel one in 225 ms instead of 321 ms (docs/images.md).
[profile.release.package.rav1d]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.csv]
opt-level = 3

[profile.release.package.encoding_rs]
opt-level = 3

[profile.release.package.mail-parser]
opt-level = 3

# The portable PDF renderer's rasterizer (hayro, on Windows/Linux and in macOS
# `portable-media` builds; not in the default macOS build). Measured on 471
# corpus pages (docs/pdf-rendering.md): these three at 3 render 1.52x faster
# than all-"z" for +131,552 B; every hayro crate at 3 was 2.33x for +1,231,888 B.
[profile.release.package.vello_cpu]
opt-level = 3

[profile.release.package.vello_common]
opt-level = 3

[profile.release.package.fearless_simd]
opt-level = 3

# The portable OCR engine's kernels and tensor code (Windows, Linux, and macOS
# with `portable-media`); its operators (tract-core) stay size-optimized.
# Measured on the macOS portable build against all of tract at "z": these two
# add 1.04 MB and convert OCR images 11-12% faster; tract-core at 3 as well
# would add 5.8 MB in all for 30% (docs/ocr.md, portable engine).
[profile.release.package.tract-linalg]
opt-level = 3

[profile.release.package.tract-data]
opt-level = 3

# Unoptimized, tract takes minutes for one image in the model-backed tests.
[profile.dev.package.tract-linalg]
opt-level = 3

[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"

[patch.crates-io]
anydoc = { path = "vendor/anydoc" }
htmd = { path = "vendor/htmd" }
lopdf = { path = "vendor/lopdf" }
pdf-inspector = { path = "vendor/pdf-inspector" }
