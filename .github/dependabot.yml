# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Python uses the native "uv" ecosystem (GA since 2025) so Dependabot updates
# pyproject.toml AND uv.lock together — PRs pass `uv sync --frozen` in CI.

version: 2
updates:
  # Python dependencies - single entry covers the whole uv workspace
  # (root and packages/markitai share one uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Dependabot's uv updater still selects this explicitly excluded release
      # as a candidate, then reports the workspace constraint as unresolvable.
      - dependency-name: "litellm"
        versions: ["1.92.0"]
      # Avoid major version updates that may break compatibility
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns:
          - "*"

  # No entry for webapp/ or website/: Dependabot's bun updater only reads
  # bun.lock lockfileVersion 1, and Bun 1.4 writes version 2 (the run fails
  # with "Unsupported bun.lock 'lockfileVersion' 2"). Its npm updater cannot
  # read bun.lock at all. JS dependencies are bumped by hand with
  # `bun update --latest` in each directory; re-add a "bun" entry once
  # Dependabot supports the current lockfile version.
