name: Desktop Web

# Markitai Web (docs/desktop-web.md), in a job for each system `platforms`
# names: the markitai archive built as release.yml builds it, staged into the
# app; desktop_web_build.py vet; the release build's package installed, the app
# run from it, a file converted by the server it starts, and the app removed
# (desktop_web_install.py). A push runs Windows x86-64 alone, and there also
# the e2e build, driven by desktop_web_e2e.py on the runner's desktop; macOS
# arm64 runs when `platforms` names it.
# The archive is cached under a key of every tracked file but the app's own, so
# a change to the app alone does not build it again.

on:
  push:
    # Branches alone: a pushed tag skips path filters and would run this on every release.
    branches: ['**']
    paths:
      - 'desktop/web/**'
      - 'desktop/icon.png'
      # The workbench the app shows, which its e2e round drives.
      - 'crates/markitai-cli/src/server/web/dist/**'
      - 'scripts/desktop_web_*.py'
      - 'scripts/test_desktop_web_*.py'
      - '.github/workflows/desktop-web.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'The systems to build and install on: a JSON list of darwin-arm64 and windows-amd64'
        type: string
        default: '["windows-amd64"]'

permissions:
  contents: read

# A newer run of the same systems waits rather than cancels: a run may be
# building the archive that later runs take from the cache. A run of other
# systems does not wait for it.
concurrency:
  group: desktop-web-${{ github.ref }}-${{ inputs.platforms || '["windows-amd64"]' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  app:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Each is a mygo platform with "-" for "/", as desktop_web_build.py names its build folder.
        platform: ${{ fromJSON(inputs.platforms || '["windows-amd64"]') }}
    runs-on: >-
      ${{ fromJSON('{"darwin-arm64": "macos-15", "windows-amd64": "windows-2025"}')[matrix.platform] }}
    timeout-minutes: 150
    env:
      BUILD: ${{ matrix.platform }}
      # The release target of the markitai the app bundles.
      TARGET: >-
        ${{ fromJSON('{"darwin-arm64": "aarch64-apple-darwin", "windows-amd64": "x86_64-pc-windows-msvc"}')[matrix.platform] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: desktop/web/go.sum
      - name: Version, and the key of the archive's sources
        id: cli
        run: |
          python scripts/release_build.py version --github-output "$GITHUB_OUTPUT"
          sources=$(git ls-tree -r HEAD \
            | grep -Ev $'\t(desktop/web/|desktop/icon\\.png$|\\.github/|docs/desktop-web\\.md$|docs/development\\.md$|scripts/(test_)?desktop_web_[^/]*\\.py$)' \
            | sha256sum | cut -c1-16)
          echo "key=desktop-web-cli-$TARGET-$RUSTUP_TOOLCHAIN-$sources" >> "$GITHUB_OUTPUT"
      - name: Restore the archive
        id: archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: ${{ steps.cli.outputs.key }}
      - name: Install Rust
        if: steps.archive.outputs.cache-hit != 'true'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Build the archive
        if: steps.archive.outputs.cache-hit != 'true'
        run: python scripts/release_build.py cli --target "$TARGET" --output dist
      - name: Install and exercise the archive
        if: steps.archive.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.cli.outputs.version }}
        run: python scripts/release_build.py smoke --target "$TARGET" dist/markitai-v"$VERSION"-"$TARGET".*
      - name: Keep the archive
        if: steps.archive.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: ${{ steps.cli.outputs.key }}
      # Vet's failure fails the run but does not hold back the builds, the e2e and the install
      # check, whose evidence says what else holds on this system.
      - name: Stage the archive
        id: stage
        env:
          VERSION: ${{ steps.cli.outputs.version }}
        run: python scripts/desktop_web_build.py stage --archive dist/markitai-v"$VERSION"-"$TARGET".*
      - name: Vet and test
        run: |
          python scripts/desktop_web_build.py vet
          cd scripts && python -m unittest test_desktop_web_build test_desktop_web_install
      - name: Build the e2e app
        id: e2e
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && matrix.platform == 'windows-amd64' }}
        run: python scripts/desktop_web_build.py build --platform "${BUILD/-//}" --e2e
      - name: Build the app and its package
        id: app
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: python scripts/desktop_web_build.py build --platform "${BUILD/-//}"
      - name: Record what was built (macOS)
        if: ${{ !cancelled() && steps.app.outcome == 'success' && matrix.platform == 'darwin-arm64' }}
        run: |
          mkdir -p .local/desktop-web-install
          sha256sum dist/markitai-v*.tar.gz "desktop/web/build/$BUILD/Markitai Web.app/Contents/MacOS/Markitai Web" \
            "desktop/web/build/$BUILD/Markitai Web.app/Contents/Resources/bin/markitai" desktop/web/build/"$BUILD"/markitai-web-*.dmg \
            | tee .local/desktop-web-install/sha256.txt
          git rev-parse HEAD | tee .local/desktop-web-install/commit.txt
          sw_vers | tee .local/desktop-web-install/system.txt
      - name: Record what was built (Windows)
        if: ${{ !cancelled() && steps.e2e.outcome == 'success' && steps.app.outcome == 'success' && matrix.platform == 'windows-amd64' }}
        run: |
          mkdir -p .local/desktop-web-install
          sha256sum dist/markitai-v*.zip "desktop/web/build/windows-amd64/Markitai Web.exe" desktop/web/build/windows-amd64/bin/markitai.exe \
            desktop/web/build/windows-amd64/markitai-web-setup-*.exe "desktop/web/build/e2e/windows-amd64/Markitai Web.exe" \
            | tee .local/desktop-web-install/sha256.txt
          git rev-parse HEAD | tee .local/desktop-web-install/commit.txt
          python -c "import winreg; print('WebView2 Runtime', winreg.QueryValueEx(winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, r'SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'), 'pv')[0])" | tee .local/desktop-web-install/webview2.txt
      - name: Drive the e2e app on the desktop
        if: ${{ !cancelled() && steps.e2e.outcome == 'success' }}
        timeout-minutes: 45
        run: python scripts/desktop_web_e2e.py "windows-ci-${{ github.run_id }}-${{ github.run_attempt }}"
      # The disk image's app in /Applications, started with a HOME of the check's own: its server
      # listens, its window is on the screen, a file converts, and it quits with 0.
      - name: Install the app, run it and remove it (macOS)
        if: ${{ !cancelled() && steps.app.outcome == 'success' && matrix.platform == 'darwin-arm64' }}
        timeout-minutes: 10
        run: python scripts/desktop_web_install.py run --package desktop/web/build/"$BUILD"/markitai-web-*.dmg --evidence .local/desktop-web-install
      - name: Install the app, run it and uninstall it (Windows)
        if: ${{ !cancelled() && steps.app.outcome == 'success' && matrix.platform == 'windows-amd64' }}
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type 'using System.Runtime.InteropServices; public static class Dpi { [DllImport("user32.dll")] public static extern bool SetProcessDPIAware(); }'
          [Dpi]::SetProcessDPIAware() | Out-Null
          $out = Join-Path $env:GITHUB_WORKSPACE '.local\desktop-web-install'
          New-Item -ItemType Directory -Force $out | Out-Null
          $log = Join-Path $out 'install.log'
          function Log([string]$text) { Write-Host $text; Add-Content -Path $log -Value $text -Encoding UTF8 }
          $failures = 0
          function Check([bool]$ok, [string]$what) { if ($ok) { Log "ok   $what" } else { Log "FAIL $what"; $script:failures++ } }
          function Shot([string]$name) {
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bitmap.Save((Join-Path $out "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
          }
          # Every listen is audited, and the firewall asks about new ones as on a desktop: the app's and
          # its server's must be on loopback alone, or Windows Defender Firewall asks the user to let
          # Markitai accept connections from the network.
          auditpol /set /subcategory:'{0CCE9226-69AE-11D9-BED3-505054503030}' /success:enable /failure:enable | Out-Null
          Set-NetFirewallProfile -All -Enabled True -NotifyOnListen True
          Log ("firewall: " + ((Get-NetFirewallProfile | ForEach-Object { "$($_.Name)=$($_.Enabled)/notify=$($_.NotifyOnListen)" }) -join ' '))
          $since = Get-Date

          $setup = Get-Item desktop\web\build\windows-amd64\markitai-web-setup-*.exe
          $installer = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Check ($installer.ExitCode -eq 0) "the installer exits 0 ($($installer.ExitCode))"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Markitai Web'
          $exe = Join-Path $dir 'Markitai Web.exe'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Markitai Web.lnk'
          Check ((Test-Path $exe) -and (Test-Path "$dir\bin\markitai.exe") -and (Test-Path "$dir\licenses") -and (Test-Path "$dir\Uninstall.exe")) "the app is installed in $dir"
          Check (Test-Path $shortcut) 'a Start menu shortcut'
          Log ("installed: " + ((Get-ChildItem $dir | ForEach-Object Name) -join ', '))

          $state = Join-Path $env:RUNNER_TEMP 'markitai-installed'
          $userHome = Join-Path $state 'home'
          $isolated = [ordered]@{
            HOME = $userHome; USERPROFILE = $userHome
            APPDATA = Join-Path $userHome 'AppData\Roaming'; LOCALAPPDATA = Join-Path $userHome 'AppData\Local'
            TEMP = Join-Path $userHome 'AppData\Local\Temp'; TMP = Join-Path $userHome 'AppData\Local\Temp'
            MARKITAI_HOME = Join-Path $state 'markitai-home'
          }
          foreach ($folder in $isolated.Values) { New-Item -ItemType Directory -Force $folder | Out-Null }
          $start = New-Object System.Diagnostics.ProcessStartInfo $exe
          $start.UseShellExecute = $false
          foreach ($name in $isolated.Keys) { $start.EnvironmentVariables[$name] = $isolated[$name] }
          $app = [System.Diagnostics.Process]::Start($start)
          $serveLog = Join-Path $isolated.APPDATA 'Markitai Web\logs\serve.log'
          $listening = $false
          for ($i = 0; $i -lt 120 -and -not $listening; $i++) {
            Start-Sleep -Milliseconds 500
            $listening = (Test-Path $serveLog) -and ((Get-Content -Raw $serveLog) -match 'Markitai server listening on http://127\.0\.0\.1:')
          }
          Check $listening "the installed app's serve listens (serve.log in APPDATA\Markitai Web\logs)"
          $serve = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($app.Id)" | Where-Object Name -eq 'markitai.exe')
          Check ($serve.Count -eq 1 -and $serve[0].ExecutablePath -eq "$dir\bin\markitai.exe" -and $serve[0].CommandLine -match 'serve --supervised') "its child is the bundled markitai.exe serve --supervised"
          Start-Sleep -Seconds 6
          $app.Refresh()
          Log "window: '$($app.MainWindowTitle)'"
          $alerts = @(Get-Process | Where-Object { $_.MainWindowTitle -match 'Security Alert|Firewall' } | ForEach-Object { "$($_.ProcessName): $($_.MainWindowTitle)" })
          Log ("firewall prompts: " + ($alerts -join '; '))
          Shot 'installed-ready'
          Check (Test-Path (Join-Path $isolated.LOCALAPPDATA 'Markitai Web\WebView2')) 'web view data in LOCALAPPDATA\Markitai Web\WebView2'
          Check (Test-Path (Join-Path $isolated.APPDATA 'Markitai Web\web.json')) 'the port kept in APPDATA\Markitai Web\web.json'
          # The release build has no automation socket: the page goes to the app's server with the
          # token the app gave it, as the workbench in the window sends one.
          if ($serve.Count -eq 1) {
            $origin = [regex]::Match((Get-Content -Raw $serveLog), 'http://127\.0\.0\.1:\d+').Value
            $converted = @(& python scripts\desktop_web_install.py convert --pid $serve[0].ProcessId --origin $origin)
            $converts = $LASTEXITCODE -eq 0
            foreach ($line in $converted) { Log "convert: $line" }
            Check $converts "the installed app's serve converts a file"
          }
          Check ($app.CloseMainWindow()) 'closing the window asks the app to quit'
          Check ($app.WaitForExit(30000) -and $app.ExitCode -eq 0) "the app quits with 0 ($($app.ExitCode))"
          if ($serve.Count -eq 1) {
            Check ($null -eq (Get-Process -Id $serve[0].ProcessId -ErrorAction SilentlyContinue)) 'its serve has ended'
          }
          Check ((Get-Content -Raw $serveLog) -match 'Server stopping: draining active conversions') 'serve drained'
          Copy-Item $serveLog (Join-Path $out 'installed-serve.log')
          $listens = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 5154, 5155, 5031; StartTime = $since } -ErrorAction SilentlyContinue | ForEach-Object {
            $data = @{}
            foreach ($field in ([xml]$_.ToXml()).Event.EventData.Data) { $data[$field.Name] = $field.'#text' }
            if ($data.Application -match 'markitai') {
              # Markitai Web.exe, the app, or bin\markitai.exe, its server
            [pscustomobject]@{ Id = $_.Id; Application = $data.Application -replace '^.*\\programs\\markitai web\\', ''; Address = $data.SourceAddress; Port = $data.SourcePort }
            }
          })
          foreach ($listen in $listens) { Log "listen event $($listen.Id): $($listen.Application) $($listen.Address):$($listen.Port)" }
          Check ($listens.Count -gt 0) 'the listens are audited'
          Check (@($listens | Where-Object { $_.Address -notin '127.0.0.1', '::1' }).Count -eq 0) 'the app and its server listen on loopback alone, so the firewall never asks'

          Start-Process (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          Check (-not (Test-Path $dir)) 'the uninstaller removes the app'
          Check (-not (Test-Path $shortcut)) 'and its Start menu shortcut'
          Check (Test-Path (Join-Path $isolated.APPDATA 'Markitai Web')) "and leaves the app's data"
          if ($failures) { throw "$failures check(s) failed" }
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-web-${{ matrix.platform }}-evidence
          path: |
            .local/desktop-web-e2e/
            .local/desktop-web-install/
            !.local/desktop-web-e2e/**/WebView2/
            !.local/desktop-web-e2e/**/*.sock
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      # The disk image on macOS, the installer on Windows.
      - name: Keep the package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markitai-web-${{ matrix.platform }}
          path: |
            desktop/web/build/${{ matrix.platform }}/markitai-web-*.dmg
            desktop/web/build/${{ matrix.platform }}/markitai-web-setup-*.exe
          if-no-files-found: warn
          retention-days: 7
