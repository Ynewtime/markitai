name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh.md'
      - 'scripts/setup.sh'
      - 'scripts/setup.ps1'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: website

      - name: Build website
        run: bun run docs:build
        working-directory: website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4  # latest as of 2026-03
        with:
          path: website/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  # latest as of 2026-03
