name: Deploy Website

# The changelog pages publish only released versions (website/scripts/changelog.mjs
# keeps the sections up to the newest vX.Y.Z tag), so a push to main deploys the
# guides without an unreleased CHANGELOG section. After the Release workflow
# (publish.yml) succeeds, the site is rebuilt from main so the new version shows.
on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh.md'
      - 'scripts/setup.sh'
      - 'scripts/setup.ps1'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The full history brings the tags the changelog filter reads.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: website

      - name: Build website
        run: bun run docs:build
        working-directory: website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
