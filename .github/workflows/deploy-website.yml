name: Deploy Website

# markitai.dev is built from website/ on main. The changelog pages are the 2.x
# notes of CHANGELOG.md / CHANGELOG.zh.md followed by the 1.x notes in
# website/changelog/, released versions only (website/scripts/changelog.mjs
# keeps a section once its vX.Y.Z tag exists), so a push to main never shows an
# unreleased section. The release commit reaches main before its tag, so its
# push builds the site without the new section; once the tag is pushed, run this
# workflow by hand on main (no release workflow starts it, and the github-pages
# environment deploys from main only).
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # Served as /setup.sh and /setup.ps1 (website/scripts/setup-scripts.mjs).
      - 'scripts/install/**'
      # The 2.x release notes on /changelog and /zh/changelog.
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh.md'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A manual run started on another branch must not publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The full history brings the tags the changelog filter reads and
          # the commit dates behind each page's "Last updated".
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: website

      - name: Build website
        run: bun run docs:build
        working-directory: website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
