name: Native validation

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'JSON list of runners: windows-2025, windows-11-arm, ubuntu-24.04, macos-15, macos-15-intel'
        required: true
        default: '["windows-2025", "ubuntu-24.04"]'
      minimum_rust:
        description: 'Also check the declared minimum toolchain'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.0
  # Test evidence lives in job logs; avoid retaining multi-GB debug metadata
  # alongside the release and extension-module builds on hosted runners.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
        lane: [checks, packages]
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.os == 'windows-2025' && 'x86_64-pc-windows-msvc' || matrix.os == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || matrix.os == 'ubuntu-24.04' && 'x86_64-unknown-linux-gnu' || matrix.os == 'macos-15' && 'aarch64-apple-darwin' || matrix.os == 'macos-15-intel' && 'x86_64-apple-darwin' || 'unknown' }}
    # Independent checks and installed-package acceptance run against the same
    # commit in parallel. Each lane keeps its complete checks and time budget.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install Rust components
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      # Dependency artifacts only: workspace/vendor code must rebuild after checkout.
      # The action also handles the nested static-CRT target directory.
      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native-v1-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.lane }}-py313-crt-split
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
      - name: Formatting, native tests, lint and harness tests
        if: matrix.lane == 'checks'
        run: python scripts/check.py
      - name: Install wheel build tool
        if: matrix.lane == 'packages'
        run: python -m pip install "maturin>=1.9,<2"
      - name: Build and exercise installable artifacts
        if: matrix.lane == 'packages'
        run: python scripts/ci_packages.py --expected-host ${{ env.TARGET }} --output .local/ci-artifacts
      - name: Retain per-platform artifacts and evidence
        if: always() && matrix.lane == 'packages'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ env.TARGET }}
          path: .local/ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  minimum-rust:
    if: ${{ inputs.minimum_rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Restore minimum-toolchain dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native-v1-minimum-rust
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
      - name: Check the declared minimum toolchain
        run: cargo check --locked -p markitai-core -p markitai-cli -p markitai-ffi
