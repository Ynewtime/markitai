name: Native validation

# Run by hand only: hosted macOS minutes cost ten times Linux minutes in a
# private repository, so each run names the runners it needs.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'JSON list of runners: windows-2025, windows-11-arm, ubuntu-24.04, macos-15, macos-15-intel'
        required: true
        default: '["windows-2025", "ubuntu-24.04"]'
      minimum_rust:
        description: 'Also check the declared minimum toolchain'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.os == 'windows-2025' && 'x86_64-pc-windows-msvc' || matrix.os == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || matrix.os == 'ubuntu-24.04' && 'x86_64-unknown-linux-gnu' || matrix.os == 'macos-15' && 'aarch64-apple-darwin' || matrix.os == 'macos-15-intel' && 'x86_64-apple-darwin' || 'unknown' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install Rust components
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - name: Formatting, native tests, lint and harness tests
        run: python scripts/check.py
      - name: Install wheel build tool
        run: python -m pip install "maturin>=1.9,<2"
      - name: Build and exercise installable artifacts
        run: python scripts/ci_packages.py --expected-host ${{ env.TARGET }} --output .local/ci-artifacts
      - name: Retain per-platform artifacts and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ env.TARGET }}
          path: .local/ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  minimum-rust:
    if: ${{ inputs.minimum_rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the declared minimum toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo check --locked -p markitai-core -p markitai-cli -p markitai-ffi
