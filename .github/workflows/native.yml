name: Native validation

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'JSON list of runners: windows-2025, windows-11-arm, ubuntu-24.04, macos-15, or [] for none'
        required: true
        default: '["windows-2025", "ubuntu-24.04"]'
      intel_mac:
        description: 'Also install and test on an Intel Mac what an arm64 Mac builds'
        type: boolean
        default: false
      minimum_rust:
        description: 'Also check the declared minimum toolchain'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.1
  # Test evidence lives in job logs; avoid retaining multi-GB debug metadata
  # alongside the release and extension-module builds on hosted runners.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  # A package lane proves that what it builds installs and works. Fat link-time
  # optimization took 64% of the Intel lane, and what ships with it is built and
  # exercised by the release workflow, on the Intel Mac too (docs/ci.md).
  CARGO_PROFILE_RELEASE_LTO: 'off'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  native:
    if: ${{ inputs.platforms != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.os == 'windows-2025' && 'x86_64-pc-windows-msvc' || matrix.os == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || matrix.os == 'ubuntu-24.04' && 'x86_64-unknown-linux-gnu' || matrix.os == 'macos-15' && 'aarch64-apple-darwin' || 'unknown' }}
      # Without link-time optimization, the macos-15 linker refuses to delay-load a
      # framework's symbol from a function that the machine outliner has made.
      RUSTFLAGS: ${{ matrix.os == 'macos-15' && '-Cllvm-args=--enable-machine-outliner=never' || '' }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install Rust
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
      # Dependency artifacts only: workspace/vendor code must rebuild after checkout.
      # The action also handles the nested static-CRT target directory.
      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native-v1-${{ matrix.os }}-${{ runner.arch }}-py313-crt-split
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
      - name: Install wheel build tool
        run: python -m pip install "maturin==1.15.0"  # pinned; see also bindings/python/pyproject.toml
      - name: Build and exercise installable artifacts
        run: python scripts/ci_packages.py --expected-host ${{ env.TARGET }} --output .local/ci-artifacts
      - name: Retain per-platform artifacts and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ env.TARGET }}
          path: .local/ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Built on an arm64 Mac, which is twice as fast, as the release workflow's
  # x86_64 macOS archive and wheel are.
  intel-bundle:
    if: ${{ inputs.intel_mac }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install Rust and maturin
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-apple-darwin
          python -m pip install "maturin==1.15.0"  # pinned; see also bindings/python/pyproject.toml
      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native-v2-intel-bundle
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
      - name: Build the bundle
        run: python scripts/ci_packages.py --build-for x86_64-apple-darwin --output .local/ci-bundle
      - name: Retain the bundle and its evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-bundle-x86_64-apple-darwin
          path: .local/ci-bundle/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  # Builds nothing, as the release workflow's smoke-intel.
  intel-packages:
    needs: intel-bundle
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-bundle-x86_64-apple-darwin
          path: .local/ci-bundle
      - name: Install and exercise the bundle
        run: python scripts/ci_packages.py --expected-host x86_64-apple-darwin --prebuilt .local/ci-bundle/native-bundle.tar.gz --output .local/ci-artifacts
      - name: Retain per-platform artifacts and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-x86_64-apple-darwin
          path: .local/ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  minimum-rust:
    if: ${{ inputs.minimum_rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Restore minimum-toolchain dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native-v1-minimum-rust
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
      - name: Check the declared minimum toolchain
        run: cargo check --locked -p markitai-core -p markitai-cli -p markitai-ffi
