name: Check

on:
  push:
    branches: [ci/check-plan-test]
  workflow_dispatch:
    inputs:
      platforms:
        required: false
        default: ''

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # The runners to use, split in native ones and the Intel Mac.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.plan.outputs.native }}
      intel: ${{ steps.plan.outputs.intel }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Pull requests leave out the Intel Mac (it waits for a macOS runner
          # and has the longest run); main and releases run it.
          if [ -n "$PLATFORMS" ]; then list=$PLATFORMS
          elif [ "$EVENT" = pull_request ]; then list='["macos-15", "ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025", "windows-11-arm"]'
          else list='["macos-15", "macos-15-intel", "ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025", "windows-11-arm"]'
          fi
          # A push to main that changes only Markdown (guides, changelogs), the
          # website and llms*.txt runs on one Linux machine: only the helper tests
          # read those (no Rust test does; they read docs/schema and licenses/,
          # which stay in scope), and they behave the same everywhere. Any doubt
          # runs every platform.
          if [ "$EVENT" = push ] && [ -z "$PLATFORMS" ]; then
            if files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename' 2>/dev/null) \
                && [ -n "$files" ] && [ "$(wc -l <<<"$files")" -lt 300 ] \
                && ! grep -qvE '\.md$|^website/|^llms(-full)?\.txt$' <<<"$files"; then
              echo "Only documentation changed: Linux only"
              list='["ubuntu-24.04"]'
            fi
          fi
          {
            echo "native=$(jq -c 'map(select(. != "macos-15-intel"))' <<<"$list")"
            echo "intel=$(jq 'index("macos-15-intel") != null' <<<"$list")"
          } >> "$GITHUB_OUTPUT"

  # Stands in for the platform jobs: prints what the matrix would run.
  show:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NATIVE: ${{ needs.plan.outputs.native }}
          INTEL: ${{ needs.plan.outputs.intel }}
        run: |
          echo "SELECTED native=$NATIVE intel=$INTEL"
