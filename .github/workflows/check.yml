name: Check

# scripts/check.py on the release platforms (docs/ci.md#checks): on a push to
# main, on pull requests, by hand, and as the release workflow's test job.
# Runs on main save a Cargo cache per platform, which every other run restores
# (a branch or tag can read main's caches); third-party and vendored crates
# then come from it and only the workspace crates build. The Intel Mac builds
# nothing: an arm64 Mac cross-compiles its tests (and lints for it), and the
# Intel Mac only runs them, in shards.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'JSON list of runners (default: all six)'
        required: false
        default: ''
      save_cache:
        description: 'Also save the cache from this branch (only this branch reads it)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      platforms:
        description: 'JSON list of runners'
        type: string
        required: true

permissions: {}

# A newer push to main (or to a pull request) replaces a running check; the
# release workflow's call has a group of its own and one run per ref.
concurrency:
  group: ${{ github.workflow }}-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

defaults:
  run:
    shell: bash

jobs:
  # The runners to use, split in native ones and the Intel Mac.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.plan.outputs.native }}
      intel: ${{ steps.plan.outputs.intel }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Pull requests leave out the Intel Mac (it waits for a macOS runner
          # and has the longest run); main and releases run it.
          if [ -n "$PLATFORMS" ]; then list=$PLATFORMS
          elif [ "$EVENT" = pull_request ]; then list='["macos-15", "ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025", "windows-11-arm"]'
          else list='["macos-15", "macos-15-intel", "ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025", "windows-11-arm"]'
          fi
          # A push to main that changes only Markdown (guides, changelogs), the
          # website and llms*.txt runs on one Linux machine: only the helper tests
          # read those (Rust tests read docs/schema, licenses/ and fixtures, which
          # stay in scope), and they behave the same everywhere. Any doubt runs
          # every platform.
          if [ "$EVENT" = push ] && [ -z "$PLATFORMS" ]; then
            if files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename' 2>/dev/null) \
                && [ -n "$files" ] && [ "$(wc -l <<<"$files")" -lt 300 ] \
                && ! grep -q '/fixtures/' <<<"$files" \
                && ! grep -qvE '\.md$|^website/|^llms(-full)?\.txt$' <<<"$files"; then
              echo "Only documentation changed: Linux only"
              list='["ubuntu-24.04"]'
            fi
          fi
          {
            echo "native=$(jq -c 'map(select(. != "macos-15-intel"))' <<<"$list")"
            echo "intel=$(jq 'index("macos-15-intel") != null' <<<"$list")"
          } >> "$GITHUB_OUTPUT"

  # The workflows themselves, with actionlint: what GitHub would refuse, and
  # what it finds only when a job runs (an expression's types and contexts, a
  # runner's name, the inputs of an action or a called workflow). The scripts
  # in `run:` are not its concern here, so shellcheck and pyflakes stay off.
  # Not as the release's test job: a release does not wait for a download.
  workflows:
    if: github.workflow == 'Check'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workflows
        env:
          VERSION: 1.7.11
          # Of actionlint_<version>_linux_amd64.tar.gz: the release's checksums
          # file and GitHub's digest of the asset agree on it.
          SHA256: 900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a
        run: |
          archive=$RUNNER_TEMP/actionlint.tar.gz
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  check:
    needs: plan
    if: needs.plan.outputs.native != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.native) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      # check.py runs the Rust tests with nextest when it is installed.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      # Keyed by the third-party dependencies (ci_cache.py key) and the vendor/
      # tree. main restores only a cache of the same dependencies, so a saved
      # cache never carries crates the lock dropped; other refs take the
      # closest one.
      - name: Cache key
        id: key
        env:
          OS: ${{ matrix.os }}
          MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          prefix="check-v1-$OS-rust$RUSTUP_TOOLCHAIN"
          dependencies=$(python scripts/ci_cache.py key)
          {
            echo "key=$prefix-$dependencies-$(git rev-parse HEAD:vendor)"
            echo "restore<<EOF"
            echo "$prefix-$dependencies-"
            if [ "$MAIN" != true ]; then echo "$prefix-"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.restore }}
      - name: Reuse the cached vendored crates
        run: python scripts/ci_cache.py restore
      - name: Formatting, tests, lint and harness tests
        run: python scripts/check.py
      # Only a passing check saves: a key is never saved twice, and a build
      # stopped by an error or a cancel would leave crates out of it. A failed
      # prune skips the save (its annotation stays) but does not fail the check.
      - name: Prune the Cargo cache
        id: prune
        if: (github.ref == 'refs/heads/main' || inputs.save_cache) && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python scripts/ci_cache.py prune
      - name: Save the Cargo cache
        if: steps.prune.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}

  # The Intel Mac's tests are built on an arm64 Mac, which compiles them in a
  # fraction of the time (cross-compiling like the release workflow's
  # x86_64 macOS archive), and only run on the Intel Mac. Clippy lints for the
  # x86_64 target here. It runs after the upload, so the Intel Mac does not wait
  # for it. Formatting and the helper tests are the same on every macOS and
  # run on the arm64 one.
  intel-build:
    needs: plan
    if: needs.plan.outputs.intel == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --target "$TARGET"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      # Its own cache: the target directory holds the x86_64 artifacts and the
      # host's build scripts, not the native lane's.
      - name: Cache key
        id: key
        env:
          MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          prefix="check-v1-macos-15-cross-$TARGET-rust$RUSTUP_TOOLCHAIN"
          dependencies=$(python scripts/ci_cache.py key)
          {
            echo "key=$prefix-$dependencies-$(git rev-parse HEAD:vendor)"
            echo "restore<<EOF"
            echo "$prefix-$dependencies-"
            if [ "$MAIN" != true ]; then echo "$prefix-"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.restore }}
      - name: Reuse the cached vendored crates
        run: python scripts/ci_cache.py restore
      - name: Build the tests for the Intel Mac
        run: python scripts/check.py --target "$TARGET" --build-tests intel-tests/tests.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intel-tests
          path: intel-tests/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Clippy for the Intel Mac
        run: python scripts/check.py --target "$TARGET" --lint
      - name: Prune the Cargo cache
        id: prune
        if: (github.ref == 'refs/heads/main' || inputs.save_cache) && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python scripts/ci_cache.py prune
      - name: Save the Cargo cache
        if: steps.prune.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.key.outputs.key }}

  # The tests run on the Intel Mac itself, in shards (its four cores are the
  # bottleneck: the tests are CPU-bound). Nothing is built here.
  intel-test:
    needs: [plan, intel-build]
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intel-tests
          path: intel-tests
      - name: Run the tests (shard ${{ matrix.shard }} of 2)
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/check.py --run-tests intel-tests/tests.tar.zst --partition "count:$SHARD/2"
