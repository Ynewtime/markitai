name: Release

# Manual release flow (no release-please). To cut a release:
#   1. bump __version__ in packages/markitai/src/markitai/__init__.py, and the
#      version in the root pyproject.toml and in server.json (both versions
#      and the `markitai[mcp]==X.Y.Z` pin of `--from`)
#   2. date the `## [X.Y.Z] - YYYY-MM-DD` section in CHANGELOG.md and
#      CHANGELOG.zh.md (the Release notes are the CHANGELOG.md section)
#   3. if a newer shared web workbench build should ship, vendor it with
#      scripts/sync_workbench.py --from <bundle> (the `lint` job below checks
#      the vendored files against their manifest)
#   4. commit + push to main
#   5. git tag vX.Y.Z && git push origin vX.Y.Z
# Pushing the tag runs this workflow: tests -> build -> tag/version check ->
# publish to PyPI -> create the GitHub Release (notes from the CHANGELOG section)
# -> publish server.json to the MCP Registry.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to (re)publish'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Run lint
        run: uv run ruff check packages/markitai/src

      # The wheel ships the vendored web workbench as committed (no rebuild
      # at publish time): every file must match the bundle's manifest.
      - name: Verify the vendored web workbench
        run: uv run python scripts/sync_workbench.py --check

  # Releases gate on the same OS/Python matrix as ci.yml: a platform-only
  # test failure (e.g. Windows) must block PyPI publishing, not just CI.
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Same bound as ci.yml: a stuck run would otherwise hold the release for
    # GitHub's default 6 hours.
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Run unit tests
        run: uv run pytest packages/markitai/tests/unit

      - name: Run integration tests
        run: uv run pytest packages/markitai/tests/integration

      # Tool environments are isolated from the workspace, so this resolves the
      # wheel's published dependencies without consulting uv.lock.
      - name: Smoke-test fresh wheel install
        shell: bash
        run: |
          uv build --package markitai --wheel --out-dir wheel-smoke --clear
          wheel="$(find wheel-smoke -name 'markitai-*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/check_wheel.py "$wheel"
          uv tool run --isolated --python '${{ matrix.python-version }}' --from "$wheel" markitai --version
          uv tool run --isolated --python '${{ matrix.python-version }}' --from "$wheel" markitai --help >/dev/null

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
      id-token: write  # PyPI trusted publishing
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false  # this job can publish: build from a clean cache
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Build package
        run: uv build --package markitai --out-dir dist --clear

      # The artefact that is uploaded, not a separate build of the tree
      - name: Check the built wheel
        run: python3 scripts/check_wheel.py dist/markitai-*.whl

      - name: Verify tag matches built version
        run: |
          built_version=$(ls dist/markitai-*.tar.gz | sed -E 's|.*/markitai-(.+)\.tar\.gz|\1|')
          expected="v${built_version}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag '$TAG' does not match built version '$built_version' (expected tag '$expected'). Bump packages/markitai/src/markitai/__init__.py before tagging."
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          notes_file="$(mktemp)"
          # Pull the matching "## [X.Y.Z]" section out of the changelog for notes.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {f=1; print; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > "$notes_file"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping creation."
          elif [ -s "$notes_file" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$notes_file"
          else
            echo "No CHANGELOG section for $version — generating notes."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  # The MCP Registry entry (server.json) points at the PyPI package, so it goes
  # out once PyPI has it: the registry reads that version's README from PyPI
  # and checks its `mcp-name:` marker. GitHub OIDC proves the io.github.Ynewtime
  # namespace (granted to this repository's owner); no token is stored.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # mcp-publisher login github-oidc
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SERVER_NAME: io.github.Ynewtime/markitai
      REGISTRY: https://registry.modelcontextprotocol.io
      # Pinned and checksummed: this job holds an identity that can publish
      # to the registry. Bump both together (digest from the release assets).
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz

      # The published entry always names this release, whatever the tagged
      # server.json says: a re-publish of an older tag (workflow_dispatch)
      # would otherwise send a stale version. A mismatch is a missed bump.
      - name: Point server.json at this release
        run: |
          version="${TAG#v}"
          committed="$(jq -r '[.version, (.packages[].version)] | unique | join(", ")' server.json)"
          if [ "$committed" != "$version" ]; then
            echo "::warning::server.json at $TAG says $committed; publishing it as $version. Bump server.json in the release commit."
          fi
          jq --arg v "$version" '.version = $v | .packages |= map(.version = $v | .runtimeArguments |= map(if .name == "--from" then .value = "markitai[mcp]==" + $v else . end))' server.json > server.json.tmp
          mv server.json.tmp server.json
          ./mcp-publisher validate server.json

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: |
          version="${TAG#v}"
          entry="${REGISTRY}/v0/servers/${SERVER_NAME//\//%2F}/versions/${version}"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$entry")" = "200" ]; then
            echo "The MCP Registry already lists $SERVER_NAME $version — skipping."
            exit 0
          fi
          # PyPI's JSON API can lag the upload by a little; the registry reads it
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/markitai/${version}/json" && break
            sleep 10
          done
          for attempt in 1 2 3; do
            ./mcp-publisher publish server.json && exit 0
            echo "Publish attempt $attempt failed; retrying in 30 s."
            sleep 30
          done
          echo "::error::Could not publish $SERVER_NAME $version to the MCP Registry. Re-run this job once the cause is fixed."
          exit 1
