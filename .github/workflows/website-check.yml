name: Website Check

on:
  push:
    branches: [main]
    paths: &paths
      - 'website/**'
      - 'scripts/install/**'
      - 'crates/markitai-cli/**'
      - 'crates/markitai-core/**'
      - 'Cargo.lock'
      - '.github/workflows/website-check.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  docs:
    name: Documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The full history brings the tags the changelog guard reads.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'

      # The release notes may correct a released section, never add one
      # whose vX.Y.Z tag does not exist yet.
      - name: Check the release notes have released versions only
        run: bun scripts/changelog.mjs --check
        working-directory: website

      # The site documents markitai 2.x; the contract tests compare its pages
      # with the CLI built from this commit (--help, config schema, presets).
      - name: Install Rust
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal

      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: website-contracts-v1
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false

      - name: Build the markitai CLI
        run: cargo build --locked -p markitai-cli

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.13'

      - name: Check documentation contracts
        env:
          MARKITAI_BIN: target/debug/markitai
        run: uv run --no-project --with 'pytest==9.1.1' pytest -p no:cacheprovider website/tests

  build:
    # Deploy Website already builds the site on pushes to main.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run docs:build
        working-directory: website
