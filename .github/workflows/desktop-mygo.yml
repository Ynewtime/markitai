name: Desktop Mygo

# Markitai Mygo (docs/desktop-mygo.md, desktop/mygo/DESIGN.md) on Windows x86-64:
# build markitai_app.dll, run go vet and go test over it, build the app and its
# e2e build, then drive the e2e build's real window on the runner's desktop
# (desktop/mygo/internal/e2e) in English and Simplified Chinese, light and dark.

on:
  push:
    # Branches alone: a pushed tag skips path filters and would run this on every release.
    branches: ['**']
    # What the job reads, so other commits do not restart it: the app, its
    # strings and icon, the core with its fixtures, and the crates it builds.
    paths:
      - 'desktop/mygo/**'
      - 'desktop/strings.json'
      - 'desktop/icon.png'
      - 'desktop/scripts/strings.py'
      - 'crates/markitai-app/**'
      - 'crates/markitai-core/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-mygo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-mygo-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_INCREMENTAL: '0'
  EVIDENCE: ${{ github.workspace }}\.local\desktop-mygo

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/mygo/go.mod
          cache-dependency-path: desktop/mygo/go.sum
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # Dependency artifacts only; build.py builds the DLL in target/mygo-windows.
      # Saved after a failed run too: the dependencies take about 20 minutes and do
      # not depend on whether the app or its e2e passed.
      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-mygo-windows-v1
          workspaces: '. -> target/mygo-windows'
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: true
      - name: Build the core, vet and test
        run: |
          mkdir -p "$EVIDENCE"
          python desktop/mygo/build.py --check 2>&1 | tee "$EVIDENCE/check.log"
      - name: Build the app and its e2e build
        run: |
          python desktop/mygo/build.py --no-core 2>&1 | tee "$EVIDENCE/build.log"
          python desktop/mygo/build.py --no-core --e2e 2>&1 | tee "$EVIDENCE/build-e2e.log"
      - name: Record what was built
        run: |
          cd desktop/mygo
          sha256sum "build/windows-amd64/Markitai Mygo.exe" build/windows-amd64/markitai_app.dll \
            "build/e2e/windows-amd64/Markitai Mygo.exe" | tee "$EVIDENCE/sha256.txt"
          git rev-parse HEAD | tee "$EVIDENCE/commit.txt"
          python -c "import winreg; print('WebView2 Runtime', winreg.QueryValueEx(winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, r'SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'), 'pv')[0])" | tee "$EVIDENCE/webview2.txt"
      - name: Drive the e2e build on the desktop
        timeout-minutes: 30
        working-directory: desktop/mygo
        env:
          CGO_ENABLED: '0'
          MARKITAI_MYGO_APP: ${{ github.workspace }}\desktop\mygo\build\e2e\windows-amd64\Markitai Mygo.exe
          MARKITAI_MYGO_E2E_OUT: ${{ github.workspace }}\.local\desktop-mygo\e2e
          MARKITAI_MYGO_E2E_WINDOW_SHOT: ${{ github.workspace }}\desktop\mygo\internal\e2e\windowshot.ps1
          MARKITAI_MYGO_E2E_PAGE_KEY: ${{ github.workspace }}\desktop\mygo\internal\e2e\pagekey.ps1
        run: go test -tags e2e -count=1 -v -timeout 25m ./internal/e2e 2>&1 | tee "$EVIDENCE/e2e.log"
      # An app a failed run left open holds files in the evidence folder,
      # which the upload cannot read then.
      - name: Stop what the e2e left running
        if: always()
        shell: pwsh
        run: |
          Get-Process 'Markitai Mygo' -ErrorAction SilentlyContinue | ForEach-Object { "stopping $($_.Id)"; $_ | Stop-Process -Force }
          Start-Sleep -Seconds 3
      - name: Keep the screenshots, logs and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: markitai-mygo-windows-evidence
          path: .local/desktop-mygo
          if-no-files-found: warn
          retention-days: 7
      - name: Keep the app folder
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: markitai-mygo-windows-amd64
          path: desktop/mygo/build/windows-amd64
          if-no-files-found: warn
          retention-days: 7
