name: Python CI

# Documentation changes are covered by Website Check, including a targeted
# README package-build check. Keep the full matrix for code and dependencies.
on:
  push:
    branches: [main]
    paths:
      - 'packages/markitai/**'
      - 'webapp/**'
      - 'scripts/sync_webapp_static.sh'
      - 'scripts/check_wheel.py'
      - 'scripts/check_licenses.py'
      - 'scripts/e2e_release_check.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/markitai/**'
      - 'webapp/**'
      - 'scripts/sync_webapp_static.sh'
      - 'scripts/check_wheel.py'
      - 'scripts/check_licenses.py'
      - 'scripts/e2e_release_check.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp:
    name: Webapp test, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --cwd webapp --frozen-lockfile

      - name: Run tests
        run: bun run --cwd webapp test

      - name: Run eslint
        run: bun run --cwd webapp lint

      # Type ladder / radius / motion / shadow discipline. The Python test
      # suite covers contrast and token discipline (test_webapp_design_guard).
      - name: Run CSS scale guard
        run: bun run --cwd webapp check:css

      - name: Run type check
        run: bun run --cwd webapp typecheck

      - name: Build webapp and verify packaged assets
        run: scripts/sync_webapp_static.sh --check

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run ruff check
        run: uv run ruff check packages/markitai/src packages/markitai/tests

      - name: Run ruff format check
        run: uv run ruff format --check packages/markitai/src packages/markitai/tests

      - name: Run pyright
        run: uv run pyright packages/markitai/src packages/markitai/tests

      - name: Run import-layer contracts
        run: uv run lint-imports

      - name: Run bandit security scan
        run: uv run bandit -r packages/markitai/src -c pyproject.toml

      # markitai is MIT; the default install must stay commercially usable.
      # Deliberately runs on the extra-free `uv sync --frozen --all-groups`
      # environment above, so it audits exactly what `pip install markitai`
      # gives a user. Fails on any non-commercial/proprietary licence, and on
      # any AGPL/GPL package outside the allowlist in the script (see NOTICE).
      - name: Run dependency license audit
        run: uv run python scripts/check_licenses.py --list

      - name: Verify package build
        run: uv build --package markitai --out-dir dist --clear

  # Quality gate for the webextract HTML->Markdown pipeline: scores the
  # local defuddle corpus (pure extraction, no network/LLM, ~10s) and fails
  # when any fixture or the corpus mean drops below its guardrail floor
  # (benchmarks/guardrails.json, floors = score * 0.9 at generation time).
  # Regenerate floors deliberately with --update-guardrails.
  # Runs for the code, dependencies, and build/integration tooling selected
  # by the workflow paths above; documentation-only changes do not trigger it.
  webextract-guardrails:
    name: Webextract quality guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run benchmark with guardrails check
        run: uv run python packages/markitai/benchmarks/webextract_quality.py --check --no-color

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Run unit tests with coverage
        run: uv run pytest packages/markitai/tests/unit --cov=markitai --cov-report=xml --cov-report=term-missing

      - name: Run integration tests with coverage
        run: uv run pytest packages/markitai/tests/integration --cov=markitai --cov-append

      # Tool environments are isolated from the workspace, so this resolves the
      # wheel's published dependencies without consulting uv.lock.
      - name: Smoke-test fresh wheel install
        shell: bash
        run: |
          uv build --package markitai --wheel --out-dir wheel-smoke --clear
          wheel="$(find wheel-smoke -name 'markitai-*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/check_wheel.py "$wheel"
          uv tool run --isolated --python '${{ matrix.python-version }}' --from "$wheel" markitai --version
          uv tool run --isolated --python '${{ matrix.python-version }}' --from "$wheel" markitai --help >/dev/null

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
