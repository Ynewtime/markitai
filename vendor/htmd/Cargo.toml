# markitai: the converter walks the scraper (html5ever 0.39) tree that
# Markitai already parses with, instead of a markup5ever_rcdom 0.38 tree, so
# the binary carries one HTML parser instantiation. Benches and examples are
# not vendored, and scraper is a regular dependency rather than the tests'
# scraper 0.26.
[dependencies.ego-tree]
version = "0.11"

[dependencies.html5ever]
version = "0.39"

[dependencies.phf]
version = "0.13.1"
features = ["macros"]

[dependencies.scraper]
version = "0.27"
default-features = false

# markitai: `HtmlToMarkdownBuilder::scripting_enabled` needs this crate's own
# instance of html5ever's generic parser (scraper's entry point takes no
# options), about 120 KB in a release binary. Default on, so the crate keeps
# upstream's interface; Markitai, which never disables scripting, opts out.
[features]
default = ["scripting-option"]
scripting-option = []

[dev-dependencies.indoc]
version = "2.0.6"

[dev-dependencies.pretty_assertions]
version = "1.4.1"

[profile.release]
debug = 2
