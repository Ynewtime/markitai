[package]
edition = "2021"
rust-version = "1.88"
name = "pdf-inspector"
version = "1.25.2"
authors = ["Firecrawl Team"]
build = false
include = [
    "/src/**",
    "/external/bcmaps/**",
    "/docs/rust-api.md",
    "/LICENSE",
    "/pdf_inspector.pyi",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast PDF inspection, classification, and text extraction with smart scanned vs text-based detection"
readme = "docs/rust-api.md"
license = "MIT"
repository = "https://github.com/firecrawl/pdf-inspector"

[features]
default = []
model-cache = [
    "vision",
    "dep:dirs",
    "dep:fs2",
    "dep:sha2",
    "dep:windows-sys",
]
model-download = [
    "model-cache",
    "dep:ureq",
]
ocr = [
    "render-pdfium",
    "ocr-oar",
    "model-download",
]
ocr-oar = [
    "model-cache",
    "dep:image",
    "dep:oar-ocr",
    "dep:ort",
]
python = [
    "pyo3",
    "ocr",
]
render-pdfium = [
    "vision",
    "dep:firecrawl-pdfium",
]
vision = []

[lib]
name = "pdf_inspector"
crate-type = [
    "lib",
    "cdylib",
]
path = "src/lib.rs"

[[bin]]
name = "pdf2md"
path = "src/bin/pdf2md.rs"

[[bin]]
name = "detect-pdf"
path = "src/bin/detect_pdf.rs"

[[bin]]
name = "dump_ops"
path = "src/bin/dump_ops.rs"

[dependencies.include_dir]
version = "0.7"

[dependencies.log]
version = "0.4"

[dependencies.once_cell]
version = "1.19"

[dependencies.pyo3]
version = "0.25"
features = [
    "extension-module",
    "abi3-py38",
]
optional = true

[dependencies.regex]
version = "1.10"

[dependencies.thiserror]
version = "2.0"

[dependencies.ttf-parser]
version = "0.25"

[dependencies.unicode-bidi]
version = "0.3"

[dependencies.unicode-normalization]
version = "0.1"

[dev-dependencies.tempfile]
version = "3.3"

[target.'cfg(all(windows, not(target_arch = "wasm32")))'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Storage_FileSystem"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.dirs]
version = "6.0"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.env_logger]
version = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.firecrawl-pdfium]
version = "0.1.0"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.fs2]
version = "0.4"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.image]
version = "0.25.6"
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.lopdf]
version = "0.46.0"
features = ["rayon"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.oar-ocr]
version = "0.9.1"
features = ["simd"]
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ort]
version = "=2.0.0-rc.13"
features = ["load-dynamic"]
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rayon]
version = "1.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.sha2]
version = "0.11"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ureq]
version = "3.4"
