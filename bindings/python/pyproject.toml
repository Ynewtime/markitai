[build-system]
# Pinned exactly: a release is built with one known maturin (CI installs the
# same version, .github/workflows/native.yml).
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "markitai"
version = "2.0.0.dev0"
description = "Convert documents, web pages and images to Markdown: CLI, MCP server and Python API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ynewtime" }]
keywords = ["markdown", "converter", "llm", "pdf", "docx", "ocr", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://markitai.dev"
Repository = "https://github.com/Ynewtime/markitai"
Changelog = "https://github.com/Ynewtime/markitai/blob/main/CHANGELOG.md"

# The command-line program, which runs in the native extension.
[project.scripts]
markitai = "markitai._cli:markitai"
mkai = "markitai._cli:mkai"
markitai-mcp = "markitai._cli:markitai_mcp"

# Python markitai's extras, kept as names so that an existing
# `pip install "markitai[serve]"` still resolves. They add nothing: the wheel
# needs no other Python package.
[project.optional-dependencies]
all = []
browser = []
claude-agent = []
copilot = []
extra-fetch = []
heif = []
legacy = []
mcp = []
ocr = []
serve = []
svg = []

[tool.maturin]
manifest-path = "../../crates/markitai-python/Cargo.toml"
module-name = "markitai._native"
python-source = "."
features = ["pyo3/extension-module"]
