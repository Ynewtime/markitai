[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "markitai"
version = "1.3.0.dev0"
description = "Native Rust document conversion for Python"
requires-python = ">=3.10"
license = "MIT"

[tool.maturin]
manifest-path = "../../crates/markitai-python/Cargo.toml"
module-name = "markitai._native"
python-source = "."
features = ["pyo3/extension-module"]
