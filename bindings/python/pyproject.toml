[build-system]
# Pinned exactly: a release is built with one known maturin (CI installs the
# same version, .github/workflows/native.yml).
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "markitai"
version = "2.0.0.dev0"
description = "Native Rust document conversion for Python"
requires-python = ">=3.10"
license = "MIT"

# The command-line program, which runs in the native extension.
[project.scripts]
markitai = "markitai._cli:markitai"
mkai = "markitai._cli:mkai"
markitai-mcp = "markitai._cli:markitai_mcp"

# Python markitai's extras, kept as names so that an existing
# `pip install "markitai[serve]"` still resolves. They add nothing: the wheel
# needs no other Python package.
[project.optional-dependencies]
all = []
browser = []
claude-agent = []
copilot = []
extra-fetch = []
heif = []
legacy = []
mcp = []
ocr = []
serve = []
svg = []

[tool.maturin]
manifest-path = "../../crates/markitai-python/Cargo.toml"
module-name = "markitai._native"
python-source = "."
features = ["pyo3/extension-module"]
