[project]
name = "markitai"
description = "Opinionated Markdown converter with native LLM enhancement support"
license = "MIT"
# Resolved against this package's root, never the repo root: keep
# packages/markitai/{LICENSE,NOTICE} in step with the canonical copies at the
# repo root (locked by tests/unit/test_packaging_licenses.py). Escaping with
# "../../LICENSE" builds, but writes a traversal entry into the wheel.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Ynewtime", email = "longqiliuye@gmail.com" }
]
# version is single-sourced from src/markitai/__init__.py (tool.hatch.version)
dynamic = ["readme", "version"]
keywords = ["markdown", "converter", "llm", "pdf", "docx", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf4llm>=1.28.2",  # >=1.28.2 is a licence floor, not a feature floor: pymupdf4llm hard-depends on a pinned pymupdf-layout, and 1.28.0 shipped that layout engine as "Polyform Noncommercial or Artifex Commercial" — a non-commercial licence inside an MIT tool. 1.28.2 restored AGPL-3.0 dual licensing (see NOTICE). Never pin back: 1.27.2.x pins pymupdf_layout==1.27.2.3, which has the same problem
    "anthropic>=1.0.0",  # Message Batches API only: litellm implements the retrieve
                         # half for Anthropic and raises NotImplementedError on create.
                         # Pure Python; httpx2/pydantic/anyio already come with litellm
    "markitdown[docx,pptx,xlsx,xls,outlook]>=0.1.5",  # office formats only; pdf handled by pymupdf4llm, audio/youtube/azure unused
    "markdownify>=1.2.3,<2",  # native HTML renderer uses the parent_tags API
    "mammoth>=1.11,<2",  # direct DOCX path; OMML still uses markitdown fallback
    "pandas>=2.2,<4",  # preserve Excel cell formatting in the direct XLSX path
    "python-pptx>=1.0.2,<2",  # direct PPTX reader and local geometry resolution
    "httpx>=0.27.0",  # unconditional imports: providers/chatgpt.py, image.py, fetch_http.py default backend
    "lxml>=5.0.0",  # converter/_patches.py python-pptx fix + webextract/dom.py fast parser
    "litellm>=1.83.0,!=1.92.0",  # >=1.83.0 excludes compromised 1.82.7/1.82.8 (March 2026 supply-chain attack); !=1.92.0 shipped manylinux-only wheels — macOS/Windows installs fall back to building its Rust extension from sdist (fails without cargo, or with pyo3-unsupported default Pythons)
    "instructor>=1.14.5",
    "click>=8.3.0",
    "rich-click>=1.9.4",
    "loguru>=0.7.3",
    "rich>=14.3.0",
    "Pillow>=12.1.0",  # sole image backend; opencv-python (121MB) was dropped in 1.0.0 — measured slower in the real spawn-pool path and worse quality (INTER_LANCZOS4 aliases on downscale)
    "aiofiles>=25.1.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.2",
    "pywin32>=310; sys_platform == 'win32'",
    "questionary>=2.1.0",
    "tinycss2>=1.2",
]

[project.urls]
Homepage = "https://markitai.dev"
Documentation = "https://markitai.dev/guide/getting-started"
Repository = "https://github.com/Ynewtime/markitai"
Changelog = "https://github.com/Ynewtime/markitai/blob/main/CHANGELOG.md"

[project.scripts]
markitai = "markitai.cli:main"
markitai-mcp = "markitai.mcp.server:main"
mkai = "markitai.cli:main"  # short alias (checked: no PyPI/homebrew/system conflict)

[project.optional-dependencies]
claude-agent = ["claude-agent-sdk>=0.1.50"]
copilot = ["github-copilot-sdk>=0.2.0"]
browser = ["playwright>=1.58.0"]
extra-fetch = ["curl-cffi>=0.14.0"]
svg = ["cairosvg>=2.9.0"]
heif = ["pillow-heif>=1.0"]
# Rust anydoc backend for legacy Office formats (.doc/.ppt, Office 97-2003).
# Optional since 1.0.0: replaces the retired Office-automation path (Windows
# COM / macOS AppleScript / LibreOffice CLI) — ~7MB, no Office install needed.
legacy = ["firecrawl-anydoc>=0.2.3"]
# Official MCP Python SDK for the bundled markitai-mcp server. The extra
# name `mcp` is a public contract — docs and install hints print
# `markitai[mcp]` verbatim; renaming it breaks both.
mcp = ["mcp>=2.0.0"]
# Local OCR for scanned PDFs/images (--ocr). Optional since 1.0.0: rapidocr
# pulls opencv-python plus its own model files, ~150MB nobody who converts
# born-digital documents ever executes. The extra name `ocr` is a public
# contract — install scripts and the CLI's own error messages print
# `markitai[ocr]` verbatim; renaming it breaks both.
ocr = ["rapidocr>=3.9.0"]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
]
all = [
    "claude-agent-sdk>=0.1.50",
    "github-copilot-sdk>=0.2.0",
    "playwright>=1.58.0",
    "curl-cffi>=0.14.0",
    "cairosvg>=2.9.0",
    "pillow-heif>=1.0",
    "firecrawl-anydoc>=0.2.3",
    "mcp>=2.0.0",
    "rapidocr>=3.9.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
    "pyright>=1.1.408",
    "lxml-stubs>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/markitai/__init__.py"

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.sdist]
exclude = ["/benchmarks/results/latest.json"]

# LICENSE and NOTICE need no entry here: `license-files` above already puts
# the package-local copies into both the sdist and the wheel's dist-info.
[tool.hatch.build.targets.sdist.force-include]
"../../README.md" = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/markitai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# benchmarks/ is dev tooling next to src/, not an installed package: the
# benchmark tests import it as `benchmarks.*`.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access (deselect with '-m \"not network\"')",
    "parity: marks extraction parity tests against fixture contracts",
]
filterwarnings = [
    # litellm: async mock coroutines not awaited inside cost_calculator
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (needed for env setup before imports)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise from in except (too verbose for simple re-raises)
    "B905",   # zip without explicit strict
    "ARG001", # unused function argument (click callback signatures)
    "ARG002", # unused method argument (callback signatures)
    "SIM102", # nested if (explicit nesting is clearer for complex conditions)
    "SIM105", # contextlib.suppress (explicit try-except is clearer)
    "SIM108", # use ternary operator instead of if-else
    "SIM103", # return condition directly (explicit return is clearer)
    "UP047",  # use type parameters (PEP 695) - TypeVar is clearer for compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["markitai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests", "**/__pycache__"]
venvPath = "../.."
venv = ".venv"
# Allow optional dependencies to be missing (claude-agent-sdk)
# These are runtime-checked before import using importlib.util.find_spec
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = "warning"
# Third-party libraries with incomplete type stubs
reportPrivateImportUsage = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportReturnType = "warning"
# Click decorator patterns (e.g., @app.group())
reportFunctionMemberAccess = "warning"
