[project]
name = "markitai-mcp"
description = "MCP server exposing markitai document and URL to Markdown conversion as agent tools"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Ynewtime", email = "27655771+Ynewtime@users.noreply.github.com" }
]
readme = "README.md"
# version is single-sourced from src/markitai_mcp/__init__.py (tool.hatch.version)
dynamic = ["version"]
keywords = ["mcp", "model-context-protocol", "markdown", "converter", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # In the workspace this resolves to the local member; the floor is the
    # first PyPI release that ships the public Python API (markitai.api).
    "markitai>=0.25.0",
    "mcp>=2.0.0",  # official MCP Python SDK; 2.0 renamed FastMCP to MCPServer
]

[project.urls]
Homepage = "https://markitai.dev"
Documentation = "https://markitai.dev/guide/mcp"
Repository = "https://github.com/Ynewtime/markitai"
Changelog = "https://github.com/Ynewtime/markitai/blob/main/CHANGELOG.md"

[project.scripts]
markitai-mcp = "markitai_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/markitai_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/markitai_mcp"]

# Lint/type settings mirror packages/markitai/pyproject.toml so both packages
# hold the same bar; keep edits in step.
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = [
    "E501",
    "E402",
    "B008",
    "B904",
    "B905",
    "ARG001",
    "ARG002",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM103",
    "UP047",
]

[tool.ruff.lint.isort]
known-first-party = ["markitai_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
venvPath = "../.."
venv = ".venv"
reportMissingTypeStubs = false
